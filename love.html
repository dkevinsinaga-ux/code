<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>❤️</title>
  <script>
    // Penjaga sekali pakai: love.html hanya bisa dibuka tepat setelah menekan
    // tombol "pencet aku" di index.html. Penandanya langsung dihapus begitu dibaca,
    // jadi buka ulang / reload / buka langsung = kembali ke awal cerita.
    try {
      var boleh = sessionStorage.getItem('fromIndex');
      sessionStorage.removeItem('fromIndex');
      if (!boleh) {
        location.replace('index.html');
      }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles/love.css">
</head>
<body>
  <canvas id="heart"></canvas>
  <audio id="backgroundMusic" loop>
    <source src="assets/blue.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>
  <script src="script/love.js?v=3"></script>
</body>
</html>
