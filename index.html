<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❤️</title>
    <link rel="stylesheet" href="styles/main.css">
<div class="wallpaper"></div>
    <div class="content">
    </div>
</head>
<body>
    <div class="bg_heart">
        <div class="message"></div>
        <a href="love.html" class="next-button">pencet aku</a>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script/main.js?v=4"></script>
<script>
    // Setiap kali halaman awal dibuka, cerita dimulai dari awal lagi:
    // penanda "boleh ke love.html" dihapus, baru dipasang saat tombol ditekan.
    try { sessionStorage.removeItem('fromIndex'); } catch (e) {}

    document.querySelector('.next-button').addEventListener('click', function () {
        try { sessionStorage.setItem('fromIndex', '1'); } catch (e) {}
    });

    // Kalau user menekan "back" dari love.html, browser memulihkan halaman ini
    // dengan state lamanya (scene terakhir). Paksa mulai lagi dari scene pertama.
    window.addEventListener('pageshow', function (e) {
        var nav = performance.getEntriesByType('navigation')[0];
        var fromBack = e.persisted || (nav && nav.type === 'back_forward');
        if (fromBack) {
            try { sessionStorage.removeItem('fromIndex'); } catch (err) {}
            currentPage = 0;
            showMessage();
        }
    });
</script>
<script>
    function setupMusic() {
        const music = document.getElementById('backgroundMusic');
        
        const isMusicPlaying = localStorage.getItem('musicPlaying') === 'true';
        const musicCurrentTime = localStorage.getItem('musicCurrentTime') || 0;

        if (isMusicPlaying) {
            music.currentTime = parseFloat(musicCurrentTime);
        }

        music.addEventListener('play', () => {
            localStorage.setItem('musicPlaying', 'true');
        });

        music.addEventListener('pause', () => {
            localStorage.setItem('musicPlaying', 'false');
        });

        setInterval(() => {
            localStorage.setItem('musicCurrentTime', music.currentTime);
        }, 1000);

        document.addEventListener('click', function startMusic() {
            music.play().catch(error => {
                console.log('Autoplay prevented', error);
            });
            document.removeEventListener('click', startMusic);
        });
    }

        document.addEventListener('DOMContentLoaded', setupMusic);
</script>

<audio id="backgroundMusic" loop>
    <source src="assets/blue.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
</audio>
</body>
</html>
